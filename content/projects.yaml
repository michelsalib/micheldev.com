# yaml-language-server: $schema=./projects.schema.json

since: 2011

# The homepage hero tiles. The CV masthead has its own set in cv.yaml — this
# page is about the open source, so its headline numbers are too.
metrics:
  - { derive: stars, label: { en: GitHub stars } }
  - { derive: repos, label: { en: public repos } }
  - { derive: live_services, label: { en: services live } }
  - { derive: oss_years, label: { en: years publishing } }

# The first entry leads the section: it gets the plate, and its subdomains are
# listed one per row. Reordering this list moves that treatment, the same way
# reordering `metrics` moves the accent tile.
active:
  - name: Notion connectors
    url: https://notion-tmdb.micheldev.com
    repo: https://github.com/michelsalib/notion-tmdb
    live: true
    tags: [typescript, bun, gcp]
    blurb: >-
      Turns a plain Notion database into a self-updating tracker — type a title,
      the connector fills in the rest. Four sources plus two scheduled backup
      jobs.
    # Block style, not flow mappings: a comma inside `{ }` is the mistake that
    # already truncated three archive descriptions once.
    subdomains:
      - host: notion-tmdb
        what: Films and TV
      - host: notion-gbook
        what: Books
      - host: notion-igdb
        what: Games
      - host: notion-billetreduc
        what: Theatre
      - host: notion-backup
        what: Scheduled backup
      - host: bitwarden-backup
        what: Scheduled backup

  - name: media-cast
    url: https://github.com/michelsalib/media-cast
    live: false
    tags: [typescript, chromecast]
    blurb: >-
      Streams local media straight to a Chromecast, without uploading it
      anywhere first.

  - name: audio-tray
    url: https://github.com/michelsalib/audio-tray
    live: false
    tags: [rust, desktop]
    blurb: >-
      A tray app for switching audio devices — and my excuse to write Rust in
      anger rather than in tutorials.

  - name: updater
    url: https://github.com/michelsalib/updater
    live: false
    tags: [typescript, windows]
    blurb: Update checking and installation for Windows desktop applications.

archive:
  heading: Open source · the Best Comparator years
  lede: >-
    Published while running my own company on Symfony2 — which is why they all
    carry its initials. Archived now, but real teams installed them.
  total_repos: 50
  repos:
    - name: BCCCronManagerBundle
      what: "Cron table manager for Symfony2"
      lang: PHP
      stars: 163
    - name: BCCResqueBundle
      what: "php-resque job queues, integrated into Symfony2"
      lang: PHP
      stars: 119
    - name: BCCExtraToolsBundle
      what: "Translation extractor, locale date parsing, unit conversion"
      lang: PHP
      stars: 93
    - name: BCCAutoMapperBundle
      what: "Object-to-object mapper"
      lang: PHP
      stars: 63
    - name: Gi7
      what: "A GitHub client for Windows Phone 7"
      lang: "C#"
      stars: 31
    - name: BCCEnumerableUtility
      what: "Array, string and enumerable helpers"
      lang: PHP
      stars: 21
    - name: chai-shallow-deep-equal
      what: "Shallow deep-equal assertion for Chai"
      lang: JS
      stars: 20

links:
