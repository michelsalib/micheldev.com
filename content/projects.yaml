# yaml-language-server: $schema=./projects.schema.json

since: 2011

# Where the live counters come from.
#
# Read at runtime by /stats.json, not at build time: the build copies this block
# to dist/.stats-sources.json — the same trick site.hosts uses for .hosts.json —
# so the server can count these without a YAML parser it does not ship.
stats:
  github_user: michelsalib
  # Which projects get counted is not listed here: it is every entry in `active`
  # that carries a `repo`, so a project named on the page is measured by
  # construction and there is no second list to keep in step with this one.
  # The same goes for npm: a card's own `npm` package is added to this list, so
  # it names only packages with no card of their own.
  npm: [chai-shallow-deep-equal]
  # First full year on npm. The history is walked from here, a year per request.
  npm_since: 2015
  packagist:
    - bcc/resque-bundle
    - bcc/auto-mapper-bundle
    - bcc/cron-manager-bundle
    - bcc/extra-tools-bundle
    - bcc/enumerable-utility
    - bcc/myrrix
    - bcc/myrrix-bundle
    - bcc/myrrix-edition
  # What the downloads tile shows before /stats.json answers — and what it keeps
  # showing for a reader without JS, or if every registry is down at once.
  #
  # A floor, deliberately: rounded down from 22,655,165 measured on 2026-08-16
  # (npm 21,140,308 · Packagist 1,514,629 · GitHub release assets 228), so the
  # number on the page can only ever understate the real one as it drifts.
  downloads_floor: 22000000

# The homepage hero tiles. The CV masthead has its own set in cv.yaml — this
# page is about the open source, so its headline numbers are too.
metrics:
  - { derive: live_services, label: { en: services live } }
  - { derive: stars, label: { en: GitHub stars } }
  - { derive: repos, label: { en: public repos } }
  - { derive: downloads, label: { en: downloads } }

# The first entry leads the section: it gets the plate, and its subdomains are
# listed one per row. Reordering this list moves that treatment, the same way
# reordering `metrics` moves the accent tile.
active:
  - name: Notion connectors
    url: https://notion-tmdb.micheldev.com
    repo: https://github.com/michelsalib/notion-tmdb
    live: true
    tags: [typescript, bun, gcp]
    blurb: >-
      Turns a plain Notion database into a self-updating tracker — type a title,
      the connector fills in the rest. Four sources plus two scheduled backup
      jobs.
    # Block style, not flow mappings: a comma inside `{ }` is the mistake that
    # already truncated three archive descriptions once.
    subdomains:
      - host: notion-tmdb
        what: Films and TV
      - host: notion-gbook
        what: Books
      - host: notion-igdb
        what: Games
      - host: notion-billetreduc
        what: Theatre
      - host: notion-backup
        what: Scheduled backup
      - host: bitwarden-backup
        what: Scheduled backup

  - name: nethound
    url: /nethound
    repo: https://github.com/michelsalib/nethound
    npm: ["@michelsalib/nethound", netbeagle]
    live: false
    tags: [typescript, cli]
    blurb: >-
      Shows which process or container listens on each port, who can reach it,
      and how everything on your machine connects — then flags what is exposed
      that shouldn't be.
    page:
      hue: 5
      drop: [Development]
      release_files: [install.sh, install.ps1]
      install:
        - label: curl
          cmd: curl -fsSL {origin}/nethound/install.sh | sh
          note: Linux, macOS, WSL · checks SHA256SUMS · into ~/.local/bin
        - label: PowerShell
          cmd: irm {origin}/nethound/install.ps1 | iex
          note: Windows · into %LOCALAPPDATA%\Programs\nethound
        - label: brew
          cmd: brew install michelsalib/nethound/nethound
          note: Homebrew, macOS and Linux · the standalone binary
        - label: scoop
          cmd: |-
            scoop bucket add nethound https://github.com/michelsalib/scoop-nethound
            scoop install nethound/nethound
          note: Windows · the standalone binary
        - label: npm
          cmd: npm install -g @michelsalib/nethound
          note: Node ≥ 20 or Bun · or npx, with nothing to install

  - name: envhound
    url: /envhound
    repo: https://github.com/michelsalib/envhound
    npm: ["@michelsalib/envhound", envhound]
    live: false
    tags: [typescript, cli]
    blurb: >-
      Finds which startup file sets each environment variable, audits your
      PATH, and changes them without leaving you to guess which dotfile wins.
    page:
      hue: 6
      drop: [Development, Releasing]
      release_files: [install.sh, install.ps1]
      install:
        - label: curl
          cmd: curl -fsSL {origin}/envhound/install.sh | sh
          note: Linux, macOS, WSL · checks SHA256SUMS · into ~/.local/bin
        - label: PowerShell
          cmd: irm {origin}/envhound/install.ps1 | iex
          note: Windows · into %LOCALAPPDATA%\Programs\envhound
        - label: brew
          cmd: brew install michelsalib/envhound/envhound
          note: Homebrew, macOS and Linux · the standalone binary
        - label: scoop
          cmd: |-
            scoop bucket add envhound https://github.com/michelsalib/scoop-envhound
            scoop install envhound/envhound
          note: Windows · the standalone binary
        - label: npm
          cmd: npm install -g @michelsalib/envhound
          note: Node ≥ 20 or Bun · or npx, with nothing to install

  - name: media-cast
    url: /media-cast
    repo: https://github.com/michelsalib/media-cast
    live: false
    tags: [typescript, electron]
    blurb: >-
      Plays the videos on your computer on a Chromecast or a smart TV,
      subtitles included — a desktop app for people who just want to watch.
    # Not a README page: media-cast is used by people who will never open a
    # terminal, so its page is written for them, here. Only the release and the
    # icon come from the repository.
    product:
      hue: 4
      title: Media Cast
      logo: build/icon.svg
      headline: Your videos, on your TV.
      lede: >-
        Drop a movie or an episode from your computer, pick the TV, press Play.
        Media Cast plays it on a Chromecast or a smart TV at home, subtitles
        included — nothing to set up on the TV, no account, and nothing
        uploaded anywhere.
      downloads:
        - os: windows
          label: Windows
          asset: '-setup\.exe$'
          note: Windows 10 and 11
        - os: mac
          label: macOS
          asset: '\.dmg$'
          note: macOS 13 or later, any Mac
      screenshots:
        - shot: ready
          alt: >-
            Media Cast with Big Buck Bunny ready to play: its audio track, its
            subtitles, and the two screens it found on the network.
        - shot: playing
          alt: >-
            Media Cast while a video plays on the living-room Chromecast: the
            progress bar, pause, skip ten seconds, and the audio and subtitles
            button.
          caption: >-
            While it plays: pause, skip, switch the subtitles or fix their
            timing — from the computer, or from your phone.
      steps:
        - title: Open Media Cast
          text: >-
            It finds the Chromecasts and smart TVs on your network by itself.
            Nothing to set up on the TV: just have it switched on.
        - title: Drop a video
          text: >-
            Drag a movie or an episode onto the window, or click Choose a video.
            MP4, MKV and AVI. Its audio and subtitles are listed straight away.
        - title: Pick the screen
          text: Click the TV or the Chromecast you want to watch on.
        - title: Press Play
          text: >-
            The video starts on the TV. Keep the computer awake while you
            watch: it is the one sending the video.
      features:
        - title: Chromecast and smart TVs
          text: >-
            Plays on Chromecast and Google TV, and on most smart TVs through
            DLNA, the standard they share. When a TV can't read a file as it
            is, Media Cast converts it while it plays.
        - title: Subtitles that show up
          text: >-
            The subtitles inside the file, or a .srt, .ass or .vtt file you
            drop along with it. TVs that ignore separate subtitles get them
            drawn into the picture, so they always appear.
        - title: Find subtitles online
          text: >-
            Search Addic7ed for TV episodes from inside the app. OpenSubtitles
            and Subdl work too, once you paste a free API key from their site
            into the settings.
        - title: Fix out-of-sync subtitles
          text: >-
            Subtitles early or late? Shift them while you watch, or line them up
            against a preview before you start. Make them bigger or smaller too.
        - title: Your phone as the remote
          text: >-
            Switch on the phone remote and scan the QR code: your phone's
            browser becomes the remote, with play and pause on its lock screen.
            Nothing to install on the phone.
        - title: Pick the language
          text: >-
            A film with several audio tracks? Choose the one to hear, and switch
            to another while it plays.
        - title: Torrents too
          text: >-
            Paste a magnet link or drop a .torrent file: it starts playing while
            it downloads, fetching only the part you are watching.
        - title: Stays at home
          text: >-
            Your file goes from your computer to the TV over your own network.
            No account, no cloud, no ads.
      first_run:
        - title: On a Mac
          points:
            - Open the .dmg and drag Media Cast into Applications.
            - >-
              The first time, macOS refuses to open it, because Media Cast is
              not notarised by Apple. Open System Settings → Privacy &
              Security, scroll down, and click Open Anyway.
            - >-
              When it asks to find devices on your local network, click Allow.
              Without that, no TV shows up.
        - title: On Windows
          points:
            - >-
              Run the installer. If SmartScreen says it protected your PC,
              click More info, then Run anyway: the installer is not signed
              with a paid certificate.
            - >-
              When the firewall asks, allow Media Cast on private networks.
              That is how the TV reaches the video.
      questions:
        - q: Is it free?
          a: >-
            Yes. No account, no ads, no subscription, and its source code is on
            GitHub.
        - q: Is my video uploaded anywhere?
          a: >-
            No. It goes from your computer straight to the TV over your home
            network. The internet is only used to look for updates, for the
            subtitles you search for, and for the torrents you open.
        - q: My TV doesn't show up.
          a: >-
            Check that the TV is on and on the same network as the computer,
            then click Look again. On a Mac, allow local network access in
            System Settings → Privacy & Security → Local Network. On Windows,
            the firewall must let Media Cast through on private networks. A VPN
            can hide the TV too.
        - q: Which videos does it play?
          a: >-
            MP4 and MKV everywhere, and AVI on smart TVs but not on a
            Chromecast. A Chromecast plays the file as it is, so H.264 video is
            the safe choice there. A smart TV that can't read a file gets a
            converted copy as it plays, in up to Full HD.
        - q: Why are the subtitles part of the picture on my TV?
          a: >-
            Most smart TVs ignore subtitles sent alongside the video, so Media
            Cast draws them into it. A Chromecast shows them the usual way.
        - q: Can I change the volume from the app?
          a: >-
            No, use the TV's remote. Many TVs, and most soundbars, don't let an
            app change their volume.
        - q: Is there a Linux version?
          a: >-
            No. Media Cast is made for Windows and macOS.

