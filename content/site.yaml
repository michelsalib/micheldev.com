repo: https://github.com/michelsalib/micheldev.com

hosts:
  canonical: micheldev.com
  redirect:
    - www.micheldev.com
    - michelsalib.com
    - www.michelsalib.com

meta:
  title: Michel Salib — web lead developer, Paris
  description: >-
    Michel Salib, web lead developer in Paris. I build the platforms a business
    runs on, and I run them — horse racing data at Matchem, fifteen years of
    financial news at London Stock Exchange, Refinitiv and Thomson Reuters.
    Open source, 510 GitHub stars.
  locale: en

hero:
  eyebrow: Paris, France
  role_html: >-
    I build the systems a business runs on — <em>and I run them</em>.
  thesis_html: >-
    Right now: the data platform behind <strong>Matchem</strong>'s horse-racing
    products, rebuilt from scratch — stack, architecture, practices — and mine
    to keep running. A media business, not a tech business. The fifteen years
    before that: financial news at <strong>Thomson Reuters</strong>, Refinitiv
    and the <strong>London Stock Exchange</strong>, the same problem with more
    people watching. Before any of it, founder and CTO of my own company.

sections:
  projects:
    path: /projects
    hue: projects
    note_html: |
      Nights and
      weekends. Built
      because I wanted
      to use them.
    heading: What I build when nobody is paying me
    lede_html: >-
      Day job is a platform a business depends on. These are the opposite:
      small, finished, and running on infrastructure I pay for myself — six
      services under this domain, one repository, one deploy.
  work:
    path: /work
    hue: work
    note_html: |
      Summary here.
      Detail on the
      <a href="/cv">CV page</a>.
    heading: Built it, and stayed to run it
    lede_html: >-
      Different industries, one problem shape: move a lot of data to a lot of
      people, fast, without going down — and be accountable when it does. Full
      detail — projects, numbers, stacks — lives on the <a href="/cv">CV page</a>.
  elsewhere:
