    Architecture- and performance-oriented web lead developer. I build the
    platforms a business runs on, then take ownership of running them —
    scalability, data flows and industrialisation, combined with technical
    design, optimisation and team leadership.
  fr: >-
    Lead Developer Web orienté architecture et performance. Je construis les
