# yaml-language-server: $schema=./cv.schema.json
# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the CV.
#
# Renders three ways, all from this file:
#   1. /cv                     — the HTML page (crawlable)
#   2. /cv-en.pdf, /cv-fr.pdf  — generated in CI, headless Chrome + @media print
#   3. the /work timeline on the homepage
#
# Translatable prose is a { en, fr } map. Everything factual (dates, employers,
# technologies, numbers) is locale-independent and written once.
#
# CURRENT ROLE: set `to: present` on an entry. That is the only switch — the
# renderer then labels it "Currently", gives it a live green dot, prints
# "2026 — now", and promotes it into the homepage hero panel. Nothing else to
# touch. Every other entry gets a closed year range and a neutral hue dot.
#
# Sources: "CV - English.pdf" and "CV - Français.pdf" (Canva exports), read
# 2026-08-11. French prose below is lifted from your own FR CV, not translated
# by me, except where the FR CV had English left in it (marked FR-WAS-ENGLISH).
# ─────────────────────────────────────────────────────────────────────────────

person:
  name: Michel Salib
  location:
    en: Paris, France
    fr: Paris 13
  # No email or phone here. This repository is public, so this file is public,
  # and GitHub code search is exactly where a phone number gets harvested from.
  # They come from the CV_EMAIL and CV_PHONE environment variables — repository
  # secrets in CI — and reach only the PDFs. The schema rejects both keys here,
  # so adding one back fails `bun run validate` instead of publishing it.
  links:
    site: https://micheldev.com
    github: https://github.com/michelsalib

privacy:
  # Which contact fields reach which output.
  page: [site, github] # /cv is crawlable — no email, no phone
  pdf: [email, phone, site, github]

headline:
  en: Web Lead Developer
  fr: Web Lead Développeur

# The "I'm looking for a position…" opener from both Canva CVs is deliberately
# omitted: Michel is not searching, and the site carries no availability signal.
summary:
  en: >-
    Architecture- and performance-oriented web lead developer. I work on
    scalability, realtime data flows and the industrialisation of solutions —
    combining technical design, optimisation and team leadership.
  fr: >-
    Lead Developer Web orienté architecture et performance. Je travaille sur la
    scalabilité, les flux de données en temps réel et l'industrialisation des
    solutions — en alliant conception technique, optimisation et pilotage
    d'équipes.

