name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Serialize deploys — never let two applies race on the same state bucket. Per
  # ref, not a constant: a constant put pull request builds in the same group as
  # main's deploys, and GitHub holds only one pending run per group, so a third
  # arrival cancelled the one waiting. Dependabot opens its updates in a batch,
  # which made that the normal case rather than a rare one — and a cancelled
  # build never reports, so a required check would wait for a result that is
  # never coming. Keyed by ref, main still serializes against itself, which is
  # all the state bucket ever needed.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for OIDC → GCP Workload Identity Federation

env:
  PROJECT_ID: micheldev-www
  REGION: us-central1
  IMAGE_URI: us-central1-docker.pkg.dev/micheldev-www/micheldev-www/site

jobs:
  # Everything that can fail without touching GCP fails here first, on pull
  # requests too. The site is built in this job because the deploy job needs the
  # artifact anyway — the image is only a file server.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate content against the schema
        run: bun run validate

      - name: Lint and format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The contact details are not in the repository — content/cv.yaml is public
      # and the schema forbids them there. They are injected here, and land only
      # in .print/, which is what the PDFs are printed from. dist/ never sees
      # them, so nothing served or containerised carries them. Absent on fork
      # PRs, where secrets are unavailable: the PDFs then print without a contact
      # line rather than failing.
      - name: Build
        env:
          CV_EMAIL: ${{ secrets.CV_EMAIL }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
        run: bun run build

      # Chrome is preinstalled on the runner, which is exactly why the PDFs are
      # printed here rather than inside the image.
      - name: Print CV PDFs
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun run pdf

      # Built here as well as in the deploy job, and this is the only step that
      # would have caught the deploy that broke: .dockerignore denies everything
      # and allows back by name, so a file added to the Dockerfile's COPY and not
      # to that allowlist is simply absent from the build context. Every check
      # above passed on that commit — none of them assembles the image, and the
      # failure only appeared after the merge, at `docker build` in deploy.
      #
      # tests/build.test.ts now asserts the two lists agree, which catches the
      # specific mistake. This catches the general one, for about fifteen
      # seconds: the image is a COPY onto a base, with nothing to compile.
      - name: Build the runtime image
        run: docker build -t micheldev-www:ci .

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          include-hidden-files: true # .hosts.json is read by the server

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .

      - name: Push image
        run: |
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="bucket=${PROJECT_ID}-tf-state"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_image: ${{ env.IMAGE_URI }}:${{ github.sha }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_enable_domain_mappings: ${{ vars.ENABLE_DOMAIN_MAPPINGS || 'false' }}
          # Must be passed, and the previous comment here had it backwards:
          # omitting it does not preserve the budget, it destroys it. The
          # variable defaults to "" in variables.tf, budget.tf is `count =
          # billing_account == "" ? 0 : 1`, so an absent value means count = 0 —
          # every CI apply deleted the budget and every local apply recreated it.
          # A secret rather than a variable, purely so the logs mask it: GitHub
          # prints the env block of every run step, variables are not masked, and
          # this repository is public. Not a credential — a billing account id is
          # useless without IAM — but it is a financial identifier and there is no
          # reason to publish it.
          TF_VAR_billing_account: ${{ secrets.BILLING_ACCOUNT }}
          # Credentials for /stats.json. All empty unless configured, and empty
          # means the secret, the IAM binding and the container's environment
          # variable are none of them created — see main.tf. The two tokens
          # share one Secret Manager secret, as a JSON object.
          #
          # The zone id is a secret rather than a variable for the same reason
          # the billing account is: it is not a credential, but this repository
          # is public and GitHub prints unmasked variables in every run's env
          # block, so there is no reason to publish it.
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not GITHUB_TOKEN: Actions reserves that name for the token it injects
          # into every run, and refuses to create a secret starting with GITHUB_.
          # This is a separate fine-grained token with no permissions, and the
          # injected one would not do — it expires with the job.
          TF_VAR_github_token: ${{ secrets.GH_STATS_TOKEN }}
        run: terraform apply -auto-approve

      - name: Smoke test the new revision
        working-directory: infra
        run: |
          URL="$(terraform output -raw service_url)"
          echo "checking ${URL}"
          for path in / /cv /cv/fr /michel-salib-cv-en.pdf; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}${path}")"
            echo "  ${path} -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          # The live counters must answer, and must answer as JSON — but not
          # necessarily with figures in them. A registry being down is a case
          # the page is built to survive, so asserting on the numbers here would
          # fail deploys for somebody else's outage.
          stats="$(curl -s "${URL}/stats.json")"
          echo "  /stats.json -> ${stats}"
          echo "${stats}" | grep -q '"at"' || exit 1
          # A 404 must actually 404, not silently serve the homepage.
          code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/definitely-not-a-page")"
          echo "  /definitely-not-a-page -> ${code}"
          [ "${code}" = "404" ] || exit 1

      - name: Deployed
        working-directory: infra
        run: |
          echo "image: ${GITHUB_SHA}"
          echo "url:   $(terraform output -raw service_url)"
