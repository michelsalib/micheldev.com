version: 2

# Monthly, not weekly. Four direct dependencies, seven actions and one base
# image do not generate enough movement to be worth a weekly pull request, and a
# batch that arrives on a predictable morning gets reviewed — a trickle does not.
#
# On `day: monday`: GitHub only documents `day` for weekly schedules, so a
# monthly run may well land on the first of the month whatever this says. It is
# written out because it is the intent. If the Monday matters more than the
# "monthly", replace the schedule with `interval: cron` and
# `cronjob: "0 5 1-7 * 1"`, which is exactly the first Monday of each month.
#
# The 7-day cooldown is the point of the whole file: nothing is offered until it
# has been public for a week, so a release that gets yanked or immediately
# patched is never proposed in the first place.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ "
    labels:
      - dependencies
    groups:
      bun:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # `directory: /` is correct here and not a copy-paste slip: the
  # github-actions ecosystem always takes the repository root and finds the
  # workflows under .github/workflows itself.
  #
  # Expect this group to be quiet. Every action in deploy.yml is pinned to a
  # bare major — actions/checkout@v7, oven-sh/setup-bun@v2 — and those tags
  # already float across minors and patches, so there is nothing for Dependabot
  # to bump until a new major appears. A new major is not minor or patch, so it
  # arrives as its own pull request and does not auto-merge. That is the
  # intended outcome, not a gap.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ "
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # One Dockerfile, one FROM: oven/bun:1-slim. Same situation as the actions —
  # `1-slim` floats, so the only bump Dependabot can ever offer is 2-slim, which
  # is a major and therefore lands as a reviewable pull request. The entry is
  # here so that the day Bun 2 ships, something says so.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ "
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
